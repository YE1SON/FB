name: Local editorial regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/editorial-diversity-christian-visuals-four-voices]
jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: python -m compileall -q engine server.py tests/test_local_editorial_engine.py
      - name: Offline editorial regression tests
        run: python -m unittest tests/test_local_editorial_engine.py -v
