name: Local editorial regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/editorial-diversity-christian-visuals-four-voices, feat/storytelling-audience-fit-scene-sync-three-voices]
jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: python -m compileall -q engine server.py tests/test_local_editorial_engine.py
      - name: Install application dependencies and HTTP test client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx
      - name: Check frontend JavaScript syntax
        run: node --check static/app.js
      - name: API, storytelling and voice-timing regression tests
        run: |
          python -m unittest tests.test_local_editorial_engine tests.test_audience_storytelling_v2 tests.test_editorial_workflow tests.test_editorial_experimentation -v
