server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://132-145-202-1.sslip.io$request_uri;
}

server {
    server_name 132-145-202-1.sslip.io;
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/132-145-202-1.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/132-145-202-1.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
